name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy matplotlib
      - name: Run run_tests.sh (sim, lab..lab7, lab4/silicon, hop_engine Python model; exit status is real)
        env:
          MPLBACKEND: Agg
        run: ./run_tests.sh
      # Not run in CI: hop_engine RTL simulation, formal and synthesis (need iverilog, Verilator, SymbiYosys, Yosys), and
      # ApproxKit (separate sibling folder; run_tests.sh skips it when absent).
      - name: CLI bench
        env:
          MPLBACKEND: Agg
        run: python -m fhss_lab bench
